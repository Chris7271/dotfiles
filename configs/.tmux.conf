# ============================================
# tmux 基础配置
# ============================================

# === 常规设置 ===

# 启用鼠标支持
set -g mouse on

# 历史记录行数
set-option -g history-limit 10000

# 从 1 开始编号（0 太远）
set -g base-index 1
setw -g pane-base-index 1

# 自动重新编号窗口
set -g renumber-windows on

# 减少 ESC 延迟（Vim 用户必备）
set -sg escape-time 0

# 刷新状态栏间隔（秒）
set -g status-interval 5

# === 快捷键绑定 ===

# 改变前缀键为 Ctrl+a（可选，更舒适）
# 如果想使用 Ctrl+a 作为前缀键，取消下面三行的注释
# set-option -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# 重载配置文件
bind r source-file ~/.tmux.conf \; display "配置已重载！"

# 更直观的分割键
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新窗口保持当前路径
bind c new-window -c "#{pane_current_path}"

# Vim 风格的窗格切换
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+方向键切换窗格（无需前缀键）
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift+方向键切换窗口
bind -n S-Left previous-window
bind -n S-Right next-window

# 快速调整窗格大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# === 窗口管理增强 ===

# Alt+数字快速跳转窗口（无需前缀键）
# 如果和 Terminal 冲突，已经禁用了 Terminal 的 Alt+数字
# 如果想保留 Terminal 功能，可以改用下面注释掉的 Ctrl+Alt+数字
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# 备选方案：Ctrl+Alt+数字（取消下面的注释使用）
# bind -n C-M-1 select-window -t :1
# bind -n C-M-2 select-window -t :2
# bind -n C-M-3 select-window -t :3
# bind -n C-M-4 select-window -t :4
# bind -n C-M-5 select-window -t :5
# bind -n C-M-6 select-window -t :6
# bind -n C-M-7 select-window -t :7
# bind -n C-M-8 select-window -t :8
# bind -n C-M-9 select-window -t :9

# 快速创建新窗口并命名
bind C command-prompt -p "窗口名称:" "new-window -n '%%'"

# 窗口排序（向左/向右移动）
bind -r "<" swap-window -t -1 \; select-window -t -1
bind -r ">" swap-window -t +1 \; select-window -t +1

# 互换任意两个窗口（提示输入目标窗口编号）
bind . command-prompt -p "与窗口编号互换:" "swap-window -t '%%'"

# 合并窗格到窗口
bind M choose-window "join-pane -h -s "%%""

# 快速查看所有窗口（树状视图）
bind W choose-tree -Zs

# === 窗格操作增强 ===

# 快速关闭窗格（不需要确认）
bind x kill-pane

# 关闭其他窗格（只保留当前）
bind X kill-pane -a

# 窗格全屏切换（使用 f 更直观）
bind f resize-pane -Z

# 窗格同步开关（同时在多个窗格输入）
bind S setw synchronize-panes \; display "窗格同步: #{?pane_synchronized,开启,关闭}"

# 将当前窗格移到新窗口
bind T break-pane

# 快速切换窗格布局
bind Space next-layout

# 均分窗格
bind = select-layout tiled

# 垂直均分
bind + select-layout even-vertical

# 水平均分
bind _ select-layout even-horizontal

# === 会话管理增强 ===

# 快速查看所有会话
bind s choose-session

# 快速切换到上一个会话
bind b switch-client -l

# 创建新会话
bind N command-prompt -p "会话名称:" "new-session -s '%%'"

# === 复制模式增强（Vim 风格）===

# 使用 Vim 键位
setw -g mode-keys vi

# 进入复制模式
bind [ copy-mode

# v 开始选择，y 复制
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# 鼠标拖拽复制
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# 粘贴
bind ] paste-buffer

# 查看粘贴缓冲区
bind P choose-buffer

# === 其他实用功能 ===

# 清屏（类似 Ctrl+L）
bind C-l send-keys 'C-l'

# 清除历史记录和屏幕
bind C-k send-keys -R \; clear-history \; display "已清除历史记录"

# 显示时钟
bind t clock-mode

# 快速打开 man 手册
bind / command-prompt "split-window -h 'exec man %%'"

# 快速打开 htop
bind m split-window -h "htop"

# 在新窗格中打开当前路径
bind e split-window -h -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-pane -t 0

# 显示窗格编号（更长时间）
bind q display-panes -d 3000

# 重新编号所有窗口
bind R move-window -r \; display "窗口已重新编号"

# 快速访问配置文件
bind E split-window -h "vim ~/.tmux.conf"

# 记录窗格输出到文件
bind P pipe-pane -o "cat >>~/tmux-#W-#I-#P.log" \; display "日志记录切换"

# === 状态栏美化 ===

# 状态栏颜色
set -g status-bg colour235
set -g status-fg colour255

# 状态栏左侧
set -g status-left-length 50
set -g status-left "#[fg=colour39,bold]#S #[fg=colour245]| "

# 状态栏右侧
set -g status-right-length 100
set -g status-right "#[fg=colour245]%Y-%m-%d #[fg=colour255,bold]%H:%M #[fg=colour245]| #[fg=colour39]#H"

# 窗口列表样式
setw -g window-status-format "#[fg=colour245] #I:#W "
setw -g window-status-current-format "#[fg=colour39,bold] #I:#W "

# 活动窗口通知
setw -g monitor-activity on
set -g visual-activity off

# === 其他优化 ===

# 支持 256 色
set -g default-terminal "screen-256color"

# 允许窗口重命名
setw -g allow-rename off
setw -g automatic-rename off

# 调整消息显示时间
set -g display-time 2000
set -g display-panes-time 2000

# 断开前自动保存会话（先保存再退出）
bind d run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh' \; detach-client

# === 插件管理（TPM）===

# 插件列表
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect 配置
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

# tmux-continuum 配置
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# 初始化 TPM（必须放在配置文件最后一行）
run '~/.tmux/plugins/tpm/tpm'
